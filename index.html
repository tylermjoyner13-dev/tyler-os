<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tyler OS Mobile</title>
  <link rel="manifest" href="manifest.webmanifest?v=156" />
  <link rel="icon" href="icons/icon.svg?v=156" />
  <link rel="stylesheet" href="styles.css?v=156" />
</head>
<body>
  <div id="app"><div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><strong>Tyler OS</strong><div style="margin-top:8px;color:#6b7280">Starting Mobile V1.5.6…</div></div></div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    // Recovery boot lives inline so it still runs when a cached external JS file is broken.
    window.TYLER_BOOT_VERSION = '1.5.5';
    window.__tylerBooted = false;

    function showTylerRecovery(message) {
      var el = document.getElementById('app');
      if (!el) return;
      el.innerHTML = '<div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;line-height:1.45">' +
        '<h2 style="margin:0 0 8px">Tyler OS Recovery</h2>' +
        '<p style="margin:0 0 10px">Mobile V1.5.6 loaded the recovery shell, but the workout screen did not finish starting.</p>' +
        '<p style="margin:0 0 10px"><strong>Your workout data has not been deleted.</strong></p>' +
        '<p style="margin:0;color:#6b7280;font-size:14px">' + String(message || 'Startup error') + '</p>' +
        '</div>';
    }

    window.addEventListener('error', function(e) {
      setTimeout(function(){ if (!window.__tylerBooted) showTylerRecovery(e.message || 'JavaScript startup error'); }, 0);
    });
    window.addEventListener('unhandledrejection', function(e) {
      setTimeout(function(){ if (!window.__tylerBooted) showTylerRecovery((e.reason && e.reason.message) || 'Startup promise error'); }, 0);
    });

    // Register/update the worker before app.js so a broken app script cannot block recovery updates.
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('./sw.js?v=156', { updateViaCache: 'none' })
        .then(function(reg){ return reg.update(); })
        .catch(function(err){ console.warn('Service worker recovery update failed', err); });
    }

    setTimeout(function(){
      if (!window.__tylerBooted) showTylerRecovery('The app did not finish starting within 8 seconds.');
    }, 8000);
  </script>
  <script src="program-data.js?v=156"></script>
  <script src="logic.js?v=156"></script>
  <script src="app.js?v=156"></script>
</body>
</html>
